[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit"
version = "0.1.0"
description = "Orbit - Python-native multi-agent orchestration framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["ai", "agents", "orchestration", "cli"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30.0"]
openai = ["openai>=1.30.0"]
all = ["anthropic>=0.30.0", "openai>=1.30.0"]

[project.scripts]
orbit = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]
